<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рапдония — MMORPG</title>
<style>
*{box-sizing:border-box}
:root{--ice:#9be5ff;--gold:#e8c878}
body{margin:0;background:#080e18;color:#edf6ff;font-family:Arial,sans-serif}
.hidden{display:none!important}
#intro{height:100svh;min-height:540px;position:relative;overflow:hidden;background:linear-gradient(#101e30 0%,#25374a 58%,#080d15 100%)}
.sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,#59728a66,transparent 52%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 12%,#fff,transparent),radial-gradient(2px 2px at 85% 18%,#fff,transparent),radial-gradient(1px 1px at 65% 10%,#d7edff,transparent),radial-gradient(2px 2px at 27% 25%,#fff,transparent);opacity:.7}
.moon{position:absolute;right:12%;top:8%;width:48px;height:48px;border-radius:50%;background:#d9edff;box-shadow:0 0 35px #9acfff88}
.city{position:absolute;inset:17% 0 24%;overflow:hidden}
.building{position:absolute;bottom:0;border:1px solid #53677a;background:linear-gradient(90deg,#152535,#344354 50%,#172635);box-shadow:inset 0 0 24px #080d17}
.building:before{content:"";position:absolute;inset:14px 8px;background:repeating-linear-gradient(90deg,transparent 0 17px,#e7bd6b 18px 23px,transparent 24px 37px),repeating-linear-gradient(0deg,transparent 0 22px,#e7bd6b 23px 28px,transparent 29px 43px);opacity:.65}
.b1{left:-3%;width:24%;height:65%;clip-path:polygon(0 12%,60% 12%,60% 0,83% 0,83% 20%,100% 20%,100% 100%,0 100%)}
.b2{left:18%;width:22%;height:48%}
.b3{right:17%;width:23%;height:57%;clip-path:polygon(0 14%,24% 14%,24% 0,70% 0,70% 14%,100% 14%,100% 100%,0 100%)}
.b4{right:-5%;width:25%;height:72%;clip-path:polygon(0 18%,20% 18%,20% 0,75% 0,75% 18%,100% 18%,100% 100%,0 100%)}
.tower{position:absolute;bottom:0;left:44%;width:13%;height:78%;background:linear-gradient(90deg,#182638,#45566a,#192737);clip-path:polygon(0 22%,25% 22%,25% 8%,40% 8%,40% 0,60% 0,60% 8%,75% 8%,75% 22%,100% 22%,100% 100%,0 100%);border-top:2px solid #b4d6e9}
.tower:after{content:"";position:absolute;inset:24% 35% 0;background:repeating-linear-gradient(0deg,#e5c778 0 9px,transparent 10px 24px)}
.street{position:absolute;left:-30%;bottom:-28%;width:160%;height:56%;background:linear-gradient(#4b5865,#101822 80%);clip-path:polygon(37% 0,63% 0,100% 100%,0 100%)}
.street:before{content:"";position:absolute;left:49%;top:0;width:2px;height:100%;background:#d6c59a66;transform:rotate(2deg)}
.lamp{position:absolute;bottom:21%;width:5px;height:100px;background:#172333;z-index:2}
.lamp:before{content:"";position:absolute;top:-5px;left:-8px;width:20px;height:15px;border-radius:50%;background:#ffe5a0;box-shadow:0 0 15px #ffd978,0 0 40px #ffd97899}
.l1{left:12%}.l2{right:12%;transform:scale(.8)}
.market{position:absolute;bottom:27%;width:95px;height:70px;background:#513f34;border:2px solid #b89a68;z-index:2}
.market:before{content:"";position:absolute;left:-8px;top:-22px;width:108px;height:25px;background:repeating-linear-gradient(90deg,#9e443b 0 18px,#e0c18a 18px 36px);clip-path:polygon(0 100%,10% 0,90% 0,100% 100%)}
.market:after{content:"";position:absolute;left:12px;right:12px;top:18px;bottom:0;background:repeating-linear-gradient(90deg,#e5c778 0 3px,transparent 3px 22px)}
.m1{left:3%;transform:scale(.8);transform-origin:bottom left}.m2{right:3%;transform:scale(.9);transform-origin:bottom right}
.person{position:absolute;bottom:18%;width:13px;height:35px;background:#172435;border-radius:7px 7px 2px 2px;z-index:3;animation:walk 3s ease-in-out infinite alternate}
.person:before{content:"";position:absolute;top:-12px;left:2px;width:9px;height:11px;background:#d3b59a;border-radius:50%}
.p1{left:24%;animation-delay:-1s}.p2{right:26%;animation-delay:-2s}.p3{left:66%;transform:scale(.8);animation-delay:-.5s}
@keyframes walk{from{translate:-7px 0}to{translate:9px 0}}
.portal-wrap{position:absolute;left:50%;top:51%;width:min(78vw,410px);aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:5;pointer-events:none}
.portal{width:0;height:0;border-radius:50%;opacity:0;background:radial-gradient(circle,#e8fbff 0%,#91e6ff 9%,#388ed8 25%,#172c5b 53%,#050a18 70%);border:2px solid #d4f7ff;box-shadow:0 0 22px #8bd8ff,0 0 65px #3b9fff,inset 0 0 30px #a8eaff;transition:none}
.portal:before{content:"";position:absolute;inset:-12px;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 25px #e8c878}
.portal:after{content:"";position:absolute;inset:12%;border:1px dashed #d9f5ff;border-radius:50%;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#intro.portal-flight .scene{transform:scale(7);transform-origin:50% 51%;transition:transform 2.1s ease-in}
.scene{position:absolute;inset:0;transition:transform 2.1s ease-in}
.heading{position:absolute;top:4%;left:4%;right:4%;text-align:center;z-index:8;text-shadow:0 2px 15px #000}
.heading h1{margin:8px 0;color:#e4f5ff;font-size:clamp(26px,7vw,40px);letter-spacing:4px}
.subtitle{color:var(--gold);font-size:11px;letter-spacing:2px}
.loading-ui{position:absolute;z-index:8;bottom:5%;left:8%;right:8%;text-align:center;text-shadow:0 2px 8px #000}
#loadingText{font-size:14px;line-height:1.5}
.progress{height:8px;background:#263849;border-radius:20px;overflow:hidden;margin:12px 0 7px}
#progressBar{width:0;height:100%;background:linear-gradient(90deg,#4ba7ff,#e6fbff);box-shadow:0 0 14px #8bd8ff}
#progressLabel{font-size:12px;color:#cdeaff}
#story{position:absolute;z-index:10;top:50%;left:6%;right:6%;transform:translateY(-50%);max-width:480px;margin:auto;padding:22px;border:1px solid #8bd8ff88;border-radius:16px;background:#07111df5;box-shadow:0 0 40px #3284cc55;animation:appear .6s ease}
#story h2{text-align:center;color:var(--gold);font-size:21px}
#story p{white-space:pre-line;line-height:1.65;font-size:15px}
.count{text-align:center;color:var(--ice);font-size:12px;letter-spacing:2px}
#story button{width:100%;padding:13px;border:1px solid #8cbfe6;border-radius:10px;background:linear-gradient(100deg,#244d70,#19334e);color:white;font-size:15px}
@keyframes appear{from{opacity:0;translate:0 15px}to{opacity:1;translate:0 0}}
@media(max-height:650px){.portal-wrap{top:49%;width:min(60vw,300px)}.heading{top:2%}.loading-ui{bottom:2%}#story{padding:15px;top:48%}#story p{font-size:14px;line-height:1.45}}
</style>
</head>
<body>
<section id="intro">
  <div class="scene">
    <div class="sky"></div><div class="stars"></div><div class="moon"></div>
    <div class="city">
      <div class="building b1"></div><div class="building b2"></div>
      <div class="tower"></div><div class="building b3"></div><div class="building b4"></div>
    </div>
    <div class="street"></div>
    <div class="lamp l1"></div><div class="lamp l2"></div>
    <div class="market m1"></div><div class="market m2"></div>
    <div class="person p1"></div><div class="person p2"></div><div class="person p3"></div>
    <div class="portal-wrap"><div class="portal" id="portal"></div></div>
  </div>
  <div class="heading">
    <div class="subtitle">ХРОНИКИ НЕИЗВЕДАННОГО МИРА</div>
    <h1>❄ РАПДОНИЯ ❄</h1>
    <div class="subtitle">ПОСЛЕДНИЙ ОПЛОТ ЧЕЛОВЕЧЕСТВА</div>
  </div>
  <div class="loading-ui" id="loadingUI">
    <div id="loadingText">Врата между мирами пробуждаются…</div>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="progressLabel">Открытие портала: 0%</div>
  </div>
  <article id="story" class="hidden">
    <div class="count" id="storyCount"></div>
    <h2 id="storyTitle"></h2>
    <p id="storyText"></p>
    <button id="nextButton" onclick="nextStory()">Далее →</button>
  </article>
</section>

<script>
const stories=[
{title:"РАПДОНИЯ — Последний оплот человечества",text:"Когда-то этот мир принадлежал людям. Города процветали, королевства развивались, а человечество верило в собственное будущее.\n\nНо однажды ведьма наложила на мир проклятие. С этого дня всё изменилось."},
{title:"Мир, обречённый на гибель",text:"Проклятие постепенно превратило мир в место, непригодное для жизни. Государства пали, города опустели, а привычный порядок исчез.\n\nСреди руин возник последний оплот человечества — Рапдония. Когда-то город состоял из четырнадцати районов."},
{title:"Цена спасения",text:"Правящая королевская семья установила обязательный налог за право жить внутри городских стен.\n\nТот, кто не мог заплатить установленную сумму, лишался права на жизнь в городе. В Рапдонии спасение имело свою цену."},
{title:"Равигион III",text:"Первым королём Рапдонии стал Равигион III, вошедший в историю под именем Бессмертного.\n\nОн умер сто пятьдесят лет назад, оставив после себя наследие, о котором до сих пор спорят."},
{title:"Война священных реликвий",text:"Около десяти лет назад Рапдонию потрясла война между феями и варварами.\n\nПричиной стали священные реликвии — артефакты, обладание которыми могло изменить баланс сил. Последствия войны до сих пор ощущаются в городе."},
{title:"Твой путь",text:"Теперь ты стоишь у порога Рапдонии — города, полного тайн, опасностей и возможностей.\n\nЧто скрывает проклятие ведьмы? Почему исчезли прежние королевства? Какие тайны хранят четырнадцать районов?\n\nОтветы ещё предстоит найти. Твоя история начинается сейчас."}
];

let progress=0;
let storyIndex=0;
let phase="opening";
const portal=document.getElementById("portal");
const intro=document.getElementById("intro");
const bar=document.getElementById("progressBar");
const label=document.getElementById("progressLabel");
const loadingText=document.getElementById("loadingText");

function animatePortal(){
  if(phase!=="opening")return;
  progress=Math.min(100,progress+0.5);
  const size=progress*3.5;
  portal.style.width=size+"px";
  portal.style.height=size+"px";
  portal.style.opacity=Math.min(1,progress/8);
  portal.style.borderWidth=(2+progress/18)+"px";
  portal.style.boxShadow=`0 0 ${10+progress/2}px #8bd8ff,0 0 ${20+progress}px #3b9fff,inset 0 0 ${10+progress/2}px #a8eaff`;
  bar.style.width=progress+"%";
  label.textContent="Открытие портала: "+Math.floor(progress)+"%";
  if(progress<100){
    requestAnimationFrame(animatePortal);
  }else{
    label.textContent="Портал открыт: 100%";
    loadingText.textContent="Переход в Рапдонию…";
    phase="flight";
    setTimeout(()=>{
      intro.classList.add("portal-flight");
      setTimeout(()=>showStory(0),2100);
    },350);
  }
}

function showStory(index){
  phase="story";
  storyIndex=index;
  document.getElementById("loadingUI").classList.add("hidden");
  const box=document.getElementById("story");
  box.classList.remove("hidden");
  document.getElementById("storyCount").textContent="ГЛАВА "+(index+1)+" ИЗ "+stories.length;
  document.getElementById("storyTitle").textContent=stories[index].title;
  document.getElementById("storyText").textContent=stories[index].text;
  document.getElementById("nextButton").textContent=index===stories.length-1?"Завершить вступление →":"Далее →";
  box.style.animation="none";
  void box.offsetWidth;
  box.style.animation="";
}

function nextStory(){
  if(storyIndex<stories.length-1){
    showStory(storyIndex+1);
  }else{
    document.getElementById("storyTitle").textContent="Добро пожаловать в Рапдонию";
    document.getElementById("storyText").textContent="Вступление завершено. Следующим шагом мы создадим новый экран игры.";
    document.getElementById("storyCount").textContent="ВСТУПЛЕНИЕ ЗАВЕРШЕНО";
    document.getElementById("nextButton").classList.add("hidden");
  }
}

requestAnimationFrame(animatePortal);
</script>
</body>
</html>
